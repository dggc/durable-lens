name: Release

# Push a tag vX.Y.Z that matches package.json. The tarball verified in the first job is the one
# published to npm and attached to the GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check the tag against package.json and main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $TAG is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Before anything ships: a version without its CHANGELOG section fails here, not after npm has it.
      - name: Take the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/pack"
          # The section whose heading is "## [X.Y.Z]" or "## X.Y.Z", up to the next "## " heading.
          awk -v version="$VERSION" '
            /^## / {
              heading = $0
              sub(/^## \[?/, "", heading)
              sub(/[] ].*/, "", heading)
              printing = (heading == version)
              next
            }
            printing { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/pack/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/pack/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - run: npm ci
      - name: Install the fixture generators
        run: |
          for dir in fixtures/generate/v[0-9]*/; do
            (cd "$dir" && npm ci --ignore-scripts)
          done
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Pack once, from the dist/ the tests just built; check that very tarball, and publish it.
      - name: Pack and check the tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          tarball="$RUNNER_TEMP/pack/durable-lens-$VERSION.tgz"
          test -f "$tarball"
          node scripts/check-package.mjs "$tarball"
          (cd "$RUNNER_TEMP/pack" && sha256sum "durable-lens-$VERSION.tgz" | tee SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            ${{ runner.temp }}/pack/*.tgz
            ${{ runner.temp }}/pack/SHA256SUMS
            ${{ runner.temp }}/pack/notes.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/durable-lens
    permissions:
      contents: read
      id-token: write # trusted publishing: exchange the OIDC token for npm publish rights
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require npm 11.5.1 or newer for trusted publishing
        run: |
          npm_version="$(npm --version)"
          echo "npm $npm_version"
          [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" = 11.5.1 ]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - name: Publish with provenance
        id: publish
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          (cd package && sha256sum --check SHA256SUMS)
          # A version published by hand (the first one, before trusted publishing could be set up) is left alone.
          if npm view "durable-lens@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::durable-lens@$VERSION is already on npm; not publishing it again"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # npm refuses a prerelease without a dist-tag; keep those off "latest".
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          # No token: npm trusted publishing exchanges this job's OIDC identity for a short-lived one.
          npm publish "package/durable-lens-$VERSION.tgz" --provenance --access public --tag "$tag"
          echo "published=true" >> "$GITHUB_OUTPUT"

  github-release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::the release $TAG exists already"
            exit 0
          fi
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          # Attach the tarball only when it is the one npm now serves, not a rebuild of a version published by hand.
          files=()
          if [ "$PUBLISHED" = true ]; then files=("package/durable-lens-$VERSION.tgz" package/SHA256SUMS); fi
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file package/notes.md \
            "${flags[@]}" \
            "${files[@]}"
