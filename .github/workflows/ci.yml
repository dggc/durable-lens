name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # The pi-durable releases the owner tests run against the fixtures.
      - run: for v in 1.2.0 1.3.0 1.4.0; do (cd fixtures/generate/v$v && npm ci --ignore-scripts); done
      - run: npm test
      - name: Check the page in a browser
        run: CHROME_BIN="$(command -v google-chrome)" npm run check:ui
